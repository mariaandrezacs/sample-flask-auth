name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pre-commit
        run: pre-commit run --hook-stage pre-commit --all-files

  test:
    name: Testes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          DATABASE_URI: sqlite:///instance/test.db
          AUTO_CREATE_TABLES: false
          SECRET_KEY: ci_secret
        run: pytest

      - name: Smoke test import
        env:
          DATABASE_URI: sqlite:///instance/test.db
          AUTO_CREATE_TABLES: false
          SECRET_KEY: ci_secret
        run: python -c "from wsgi import app"
